<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix NG</title>
    <link rel="stylesheet" href="./netflix.css">
</head>
<body>
   <nav>
  <div class="left-box">
    <img class="logo" src="./Assets/netflix-removebg-preview.png" alt="netflix logo">
  </div>
  <div class="right-box">
    <button class="btn">Sign In</button>
  </div>
</nav>

<section class="middle-box">
  <div class="head">
    <h1>Unlimited movies, TV<br>shows, and more</h1>
  </div>
  <div class="body">
    <p>Starts at ₦2,500. Cancel anytime.</p>
    <p>Ready to watch? Enter your email to create or restart your membership.</p>
    
    <div class="input-group">
      <input class="src" type="email" placeholder="Email address">
      <button id="btn">Get Started ></button>
    </div>
  </div>
</section>
        

    
    
</body>
</html>
